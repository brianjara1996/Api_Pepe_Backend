spring.application.name=backend
# ===============================
# SERVER
# ===============================
server.port=8088

# ===============================
# MULTIPART (audio upload)
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# OPENAI CONFIG
# ===============================
pepe.openai.api-key=${OPENAI_API_KEY}
pepe.openai.base-url=https://api.openai.com/v1

gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
gemini.model=gemini-2.5-flash

pepe.openai.transcription-model=gpt-4o-mini-transcribe
pepe.openai.response-model=gpt-4.1-mini
pepe.openai.tts-model=gpt-4o-mini-tts
pepe.openai.tts-voice=onyx
pepe.openai.tts-style-instructions=Voce maschile anziana, profonda e calma.

# ===============================
# APP CONFIG
# ===============================
pepe.app.default-profile-name=Brian
pepe.app.default-family-target=Jara
pepe.app.region=Lombardia
pepe.app.dialect-enabled=false
pepe.app.mock-whatsapp=true

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
